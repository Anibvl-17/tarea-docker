version: '3.8'

services:
  # Frontend
  frontend:
    build: ./frontend
    container_name: app-container
    env_file:
      - .env
    ports: 
      - 5173:5173
    depends_on: # Inicia backend primero, luego frontend
      - backend

  # Backend
  backend:
    build: ./backend
    container_name: api-container
    env_file:
      - .env
    ports:
      - 3000:3000
    depends_on: # Inicia primero la base de datos, luego el backend
      - db

  # Base de datos (PostgreSQL)
  db:
    image: postgres:18-alpine
    container_name: db-container
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
     - data:/var/lib/postgresql/data

volumes:
  data: